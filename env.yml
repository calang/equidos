name: equids
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  # - bandit
  # - bokeh
  # - flask
  # - flask-talisman
  # - gunicorn
  # - jinjasql
  - jupyterlab
  - ipympl
  - ipywidgets
  # - jsonschema
  # - matplotlib
  # - nltk
  # - numpy
  - pandas
  # - pdoc3
  - pillow
  # - plotly
  - pylint
  - pytest
  - python>=3.11
  - python-dotenv
  - pyyaml
  # PyTorch with CUDA support (from pytorch channel)
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.1
  # TensorFlow will be installed via pip (see requirements.txt or pip install after env setup)
  # Other ML packages
  - transformers
  # - requests
  # - scikit-learn
  # - sympy
  # CUDA and TensorFlow GPU Setup:
  #   Requires NVIDIA drivers installed on the system (e.g., via ubuntu-drivers)
  #   Environment variables needed (set in .bashrc or Makefile):
  #     CUDA_DIR=/path/to/miniforge3/envs/equids
  #     XLA_FLAGS=--xla_gpu_cuda_data_dir=$CUDA_DIR
  #     LD_LIBRARY_PATH=$CUDA_DIR/lib:$LD_LIBRARY_PATH
  #     TF_ENABLE_ONEDNN_OPTS=0
  # - xgboost
  # - xlrd
  - pip
  - pip:
     - -r requirements.txt
